source_format: >-
  UN consolidated-list XML. Verified live twice: 2026-08-06 (endpoint reachability,
  INDIVIDUALS-only) and again 2026-08-07 as part of the Live Reference Data Platform v1
  milestone, this time fetching and fully parsing/normalizing/validating the complete
  document end to end (736 individuals, 275 entities, zero field-coverage quarantine).
  This URL 302-redirects to a signed, time-limited blob URL (must be followed, not
  hardcoded); root element CONSOLIDATED_LIST, dateGenerated attribute. Both INDIVIDUALS
  and ENTITIES record shapes are now confirmed live and covered by fields.yml (un-fields-v2),
  including previously-unobserved fields: TITLE, DESIGNATION, GENDER, NAME_ORIGINAL_SCRIPT,
  multi-valued INDIVIDUAL_DOCUMENT (up to 14 observed on one real record) and
  INDIVIDUAL_PLACE_OF_BIRTH (up to 5 observed), LAST_REVIEWED_ON (entities)/LAST_DAY_UPDATED,
  and full STREET/STATE_PROVINCE/ZIP_CODE address detail. See PROGRESS.md's "Live Reference
  Data Platform v1" entry for exactly how this was verified.

