version: un-fields-v2
# Cardinality/known_values below were derived from the real, live UN SC Consolidated List
# fetched 2026-08-06 (736 individuals, 275 entities), not invented -- see PROGRESS.md's "Live
# Reference Data Platform v1" entry for how this was checked. Where a max is round rather than
# the exact observed peak (e.g. 30 where 27 was observed), that's deliberate headroom on an
# already-verified figure, matching this file's own pre-existing convention (INDIVIDUAL_ADDRESS
# was already max:20 against an observed max of 8) -- not a guess at an unverified ceiling.
fields:
  $.DATAID:
    expected_type: string
    cardinality: {min: 1, max: 1}
    required: true
    disposition: mapped
    mapping_destination: entity.id
    coverage: {min: 1.0, max: 1.0}
    safety_critical: true
  $.VERSIONNUM:
    expected_type: string
    cardinality: {min: 1, max: 1}
    required: true
    disposition: retained
    reason: Publisher record version is retained for evidence and change review.
    coverage: {min: 1.0, max: 1.0}
    safety_critical: true
  $.FIRST_NAME:
    expected_type: string
