  # -- Aliases (max observed: 23 individual, 27 entity; the two quality vocabularies are
  # genuinely different in the real source, not a transcription slip -- individuals use a
  # confidence rating, entities use an alias-type label) --
  $.INDIVIDUAL_ALIAS[].QUALITY:
    expected_type: string
    cardinality: {min: 0, max: 30}
    required: false
    known_values: ["", Good, Low]
    disposition: retained
    reason: Alias confidence rating is retained alongside each source-native alias.
    coverage: {min: 0.0, max: 1.0}
    safety_critical: true
  $.INDIVIDUAL_ALIAS[].ALIAS_NAME:
    expected_type: string
    cardinality: {min: 0, max: 30}
    required: false
    disposition: mapped
    mapping_destination: alias
    coverage: {min: 0.0, max: 1.0}
  $.INDIVIDUAL_ALIAS[].NOTE:
    expected_type: string
    cardinality: {min: 0, max: 30}
    required: false
    disposition: retained
    reason: Free-text alias annotation; no safe general matching projection.
    coverage: {min: 0.0, max: 1.0}
  $.INDIVIDUAL_ALIAS[].CITY_OF_BIRTH:
    expected_type: string
    cardinality: {min: 0, max: 30}
    required: false
    disposition: retained
    reason: Alias-scoped birth city (distinct from the record's own INDIVIDUAL_PLACE_OF_BIRTH); retained pending a reviewed projection rule for alias-scoped identity facts.
    coverage: {min: 0.0, max: 1.0}
  $.INDIVIDUAL_ALIAS[].COUNTRY_OF_BIRTH:
