    required: true
    known_values: [Al-Qaida, CAR, DPRK, DRC, GB, Haiti, Iran, Iraq, Libya, Somalia, SouthSudan, Sudan, Taliban, Yemen]
    disposition: mapped
    mapping_destination: program
    reason: Source-specific legal structure is retained at Layer 1 and additionally projected as FtM `program`.
    coverage: {min: 1.0, max: 1.0}
    safety_critical: true
  $.REFERENCE_NUMBER:
    expected_type: string
    cardinality: {min: 1, max: 1}
    required: true
    disposition: retained
    reason: Publisher designation reference is retained below the lossy matching projection.
    coverage: {min: 1.0, max: 1.0}
    safety_critical: true
  $.LISTED_ON:
    expected_type: string
    cardinality: {min: 1, max: 1}
    required: true
    disposition: mapped
    mapping_destination: createdAt
    coverage: {min: 1.0, max: 1.0}
    safety_critical: true
  $.COMMENTS1:
    expected_type: string
    cardinality: {min: 0, max: 1}
    required: false
    disposition: mapped
    mapping_destination: notes
