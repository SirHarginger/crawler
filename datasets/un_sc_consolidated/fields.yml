    cardinality: {min: 0, max: 30}
    required: false
    disposition: retained
    reason: Alias-scoped birth date; retained pending a reviewed projection rule for alias-scoped identity facts.
    coverage: {min: 0.0, max: 1.0}
  $.ENTITY_ALIAS[].QUALITY:
    expected_type: string
    cardinality: {min: 0, max: 30}
    required: false
    known_values: ["", "a.k.a.", "f.k.a."]
