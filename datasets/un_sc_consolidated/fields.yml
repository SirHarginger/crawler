    expected_type: string
    cardinality: {min: 0, max: 15}
    required: false
    disposition: retained
    reason: "BETWEEN-precision range bound; retained but not projected (birthDate expects a single value, and a range's lower/upper bound is not that fact -- projecting only one bound would misrepresent the publisher's own stated uncertainty)."
