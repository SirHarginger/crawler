  # -- Dates of birth (max observed: 10 per individual) --
  $.INDIVIDUAL_DATE_OF_BIRTH[].TYPE_OF_DATE:
    expected_type: string
    cardinality: {min: 0, max: 15}
    required: false
    known_values: ["", EXACT, APPROXIMATELY, BETWEEN]
    disposition: retained
    reason: Date precision semantics are retained and projected only where explicit.
    coverage: {min: 0.0, max: 1.0}
    safety_critical: true
  $.INDIVIDUAL_DATE_OF_BIRTH[].DATE:
    expected_type: string
    cardinality: {min: 0, max: 15}
    required: false
