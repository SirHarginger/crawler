source_format: >-
  EU Financial Sanctions Files (FSF) XML export. This URL responded live on
  2026-08-06 with content exceeding this session's fetch tool's 10 MB cap --
  evidence of a live, substantial response, but the content itself was NOT
  independently inspected this session (unlike un_sc_consolidated, where full
  content was fetched and confirmed). Element structure below (sanctionEntity
  records carrying logicalId/euReferenceNumber, a subjectType classification
  code, and repeated nameAlias/address/citizenship/identification/birthdate/
  regulation groups expressed mostly as XML attributes rather than nested
  text elements) is built from the EU FSF schema's long-published, stable
  public documentation, not from a live capture. This is meaningfully less
  verified than un_sc_consolidated or us_ofac_sdn -- confirm field and
  attribute names against a live capture
  (`screening-crawler record-fixture eu_fsf`) before any production crawl.
