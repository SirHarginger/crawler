source_format: >-
  UK Sanctions List XML. IMPORTANT PUBLISHER CHANGE found this session: the
  OFSI Consolidated List of Financial Sanctions Targets (the historical
  ConList.xml at ofsistorage.blob.core.windows.net, per the earlier legacy
  gb_ofsi naming) formally closed on 28 January 2026 and is no longer
  updated; the UK Sanctions List, published by FCDO at the URL above, is now
  the sole authoritative source. This URL responded live on 2026-08-06 with
  content exceeding this session's fetch tool's 10 MB cap -- evidence of a
  live, substantial response, but the content was NOT independently
  inspected this session. Element structure below (a FinancialSanctionsTarget
  -style record with UniqueID, Name1-6 positional name parts, DateOfBirth,
  Nationality, RegimeName, ListingDate, GroupTypeDescription, and repeated
  Alias/Address groups) is built from the historical OFSI schema's
  long-published, stable public documentation, not from a live capture of
  the *new* FCDO-published file, and the rebrand may have changed field
  names. This is the least-verified dataset onboarded this session -- confirm
  field names against a live capture
  (`screening-crawler record-fixture gb_ofsi`) before any production crawl.
