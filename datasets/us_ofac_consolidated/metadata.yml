key: us_ofac_consolidated
title: US OFAC Consolidated Sanctions List (Non-SDN)
publisher_authority: US Department of the Treasury, Office of Foreign Assets Control
legal_basis: contractual
risk_semantics: sanction
expected_cadence: conditional_polling
freshness_slo_hours: 2
anomaly_threshold: 0.15
distribution_restriction: public
redistribution_basis: Primary publisher public record; operational review still required
dataset_scope: >-
  Non-SDN OFAC sanctions programmes as supplied by the publisher (e.g.
  Sectoral Sanctions Identifications, Foreign Sanctions Evaders, and other
  non-SDN designation lists). Distinct list, distinct legal consequence, from
  us_ofac_sdn even though the publisher issues both through the same
  pipeline and XML schema.
parser_version: ofac-consolidated-xml-v1
mapping_version: ofac-consolidated-ftm-v1
normalization_version: base-v1
layer_1_5_enabled: true
layer_1_5_justification: OFAC separates the sanctioned party from its program/list membership and identifier records, which FollowTheMoney flattens.
source_endpoint: https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/CONSOLIDATED.XML
source_format: >-
  OFAC Consolidated (non-SDN) XML. Endpoint verified live 2026-08-06
  (302-redirects to a signed, time-limited S3 export named
  "consolidated.xml"; the redirect must be followed, never hardcoded or
  cached). Same publishing pipeline and element structure as us_ofac_sdn
  (sdnList/sdnEntry with uid, firstName/lastName, sdnType, programList,
  akaList, addressList, idList, dateOfBirthList, nationalityList) -- this
  session did not independently re-verify current field names against live
  content (same caveat as us_ofac_sdn; the file is large and the fetch tool
  timed out). Confirm field names against a live capture
  (`screening-crawler record-fixture us_ofac_consolidated`) before the first
  production crawl. sdnType values other than Individual/Entity are not
  modelled and quarantine the snapshot rather than being silently mapped or
  dropped.
