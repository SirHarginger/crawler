repos:
  - repo: local
    hooks:
      - id: no-generated-reference-data
        name: Block generated, secret, and restricted reference data
        entry: python tools/check_public_repo.py
        language: system
        pass_filenames: false
      - id: synthetic-fixtures-only
        name: Run public-boundary tests
        entry: python -m pytest tests/test_public_repository_controls.py -q
        language: system
        pass_filenames: false

