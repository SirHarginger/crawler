[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "screening-crawler"
version = "0.1.0"
description = "Auditable source acquisition and release tooling for sanctions, PEP and risk screening"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0.12,<7",
  "types-jsonschema>=4.23,<5",
]

# The research egress service (docs/research-egress.md): the only place live investigation
# search and page fetches leave the platform. Optional: the release crawler needs none of it.
# trafilatura and htmldate are pinned exactly: the extractor version is recorded with every
# piece of evidence, and the engine pins the same trafilatura.
research = [
  "fastapi>=0.115,<1",
  "htmldate==1.11.0",
  "httpx>=0.28,<1",
  "lxml>=5,<7",
  # The Public Suffix List, bundled: approved source domains are checked against it
  # (research/source_policy.py). Pinned so a policy decision does not change unseen.
  "publicsuffixlist==1.1.0.20261010",
  "pydantic>=2.7,<3",
  "trafilatura==2.0.0",
  "uvicorn>=0.34,<1",
]

[project.scripts]
screening-crawler = "screening_crawler.cli:main"
screening-research-egress = "screening_crawler.research.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/screening_crawler", "datasets"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["screening_crawler"]

[[tool.mypy.overrides]]
module = ["trafilatura", "trafilatura.*", "htmldate", "htmldate.*", "lxml", "lxml.*"]
ignore_missing_imports = true
