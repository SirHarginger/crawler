[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "screening-crawler"
version = "0.1.0"
description = "Auditable source acquisition and release tooling for sanctions, PEP and risk screening"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0.12,<7",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
screening-crawler = "screening_crawler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/screening_crawler", "datasets"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["screening_crawler"]
